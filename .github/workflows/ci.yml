name: CI Pipeline

# Triggers: Push to main/develop branches or PRs targeting them
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Global environment variables for all jobs
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/luminara

jobs:
  # ============================================================================
  # JOB 1: Code Quality & Testing
  # ============================================================================
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Rust toolchain with formatting and linting tools
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rustfmt, clippy
          override: true

      # Cache Cargo registry to speed up dependency downloads
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Cache Cargo git dependencies
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      # Cache compiled artifacts to speed up builds
      - name: Cache target directory
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      # Verify code formatting follows Rust standards
      - name: Check formatting
        run: cargo fmt -- --check

      # Run Clippy linter with all features enabled, treating warnings as errors
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Execute unit tests (tests within src/ files)
      - name: Run unit tests
        run: cargo test --workspace --lib

      # Execute integration tests (tests in tests/ directory)
      - name: Run integration tests
        run: cargo test --workspace --tests

      # Run documentation tests (code examples in /// comments)
      - name: Run doc tests
        run: cargo test --workspace --doc

  # ============================================================================
  # JOB 2: Security Scanning
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test  # Only run if tests pass
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Scan filesystem for vulnerabilities in dependencies and code
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'           # Scan filesystem
          scan-ref: '.'             # Scan current directory
          format: 'sarif'           # Output in SARIF format for GitHub Security
          output: 'trivy-results.sarif'

      # Upload scan results to GitHub Security tab (always run even if scan fails)
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # Check Cargo dependencies for known security vulnerabilities
      - name: Audit dependencies
        run: |
          cargo install cargo-audit
          cargo audit

