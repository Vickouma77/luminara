name: CD - Release to Staging

on:
  push:
    branches:
      - release/*
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/luminara

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(echo ${{ github.ref }} | sed 's/refs\/heads\/release\///')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Git tag
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

  build-release-images:
    name: Build Release Images
    runs-on: ubuntu-latest
    needs: create-release
    
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - account-service
          - transaction-service
          - kyc-service
          - notification-service
          - payment-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:staging-${{ needs.create-release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:v${{ needs.create-release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:v${{ needs.create-release.outputs.version }}

  create-staging-pr:
    name: Create Staging PR
    runs-on: ubuntu-latest
    needs: [create-release, build-release-images]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update staging manifests
        run: |
          cd k8s/overlays/staging
          
          services=(api-gateway auth-service user-service account-service transaction-service kyc-service notification-service payment-service)
          
          for service in "${services[@]}"; do
            kustomize edit set image \
              ${service}=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${service}:staging-${{ needs.create-release.outputs.version }}
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update staging to v${{ needs.create-release.outputs.version }}"
          title: "Deploy v${{ needs.create-release.outputs.version }} to Staging"
          body: |
            ## Release v${{ needs.create-release.outputs.version }} to Staging
            
            ### Changes
            - Update all service images to version `staging-${{ needs.create-release.outputs.version }}`
            
            ### Checklist
            - [ ] All tests passing
            - [ ] Security scans clean
            - [ ] Database migrations ready
            - [ ] Rollback plan documented
            
            ### Deployment Steps
            1. Approve this PR
            2. Merge to trigger ArgoCD sync
            3. Monitor staging environment
            4. Run smoke tests
            
            **Note**: This requires manual approval in ArgoCD before deployment.
          branch: release/staging-${{ needs.create-release.outputs.version }}
          base: main
          labels: |
            staging
            release
          reviewers: |
            ${{ github.actor }}

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, create-staging-pr]
    if: always()
    
    steps:
      - name: Send notification
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "🚀 Release v${{ needs.create-release.outputs.version }} ready for staging",
              attachments: [{
                color: '${{ job.status }}' === 'success' ? 'good' : 'danger',
                text: `Version v${{ needs.create-release.outputs.version }} has been built and is ready for staging deployment.\n\nReview the PR to deploy to staging environment.`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
