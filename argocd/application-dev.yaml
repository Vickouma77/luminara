apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: luminara-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: luminara
  
  source:
    repoURL: https://github.com/Vickouma77/luminara.git
    targetRevision: main
    path: k8s/overlays/dev
  
  destination:
    server: https://kubernetes.default.svc
    namespace: luminara-dev
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
  
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
