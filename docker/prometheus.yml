global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8001']
  
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8002']
  
  - job_name: 'account-service'
    static_configs:
      - targets: ['account-service:8003']
  
  - job_name: 'transaction-service'
    static_configs:
      - targets: ['transaction-service:8004']
  
  - job_name: 'kyc-service'
    static_configs:
      - targets: ['kyc-service:8005']
  
  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:8006']
  
  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:8007']
