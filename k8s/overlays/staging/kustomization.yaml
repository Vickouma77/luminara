apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: luminara-staging

resources:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging

replicas:
  - name: api-gateway
    count: 2
  - name: auth-service
    count: 2
  - name: user-service
    count: 2
  - name: account-service
    count: 2
  - name: transaction-service
    count: 2
  - name: kyc-service
    count: 1
  - name: notification-service
    count: 1
  - name: payment-service
    count: 2

configMapGenerator:
  - name: luminara-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - RUST_LOG=info
      - ENVIRONMENT=staging
